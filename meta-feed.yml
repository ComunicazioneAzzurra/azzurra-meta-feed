name: Feed Meta Azzurra Store

on:
  schedule:
    # Ogni notte alle 02:15 UTC (04:15 ora italiana): DealerK rigenera il feed verso le 02:35 italiane
    - cron: "15 2 * * *"
  workflow_dispatch: {}   # pulsante "Run workflow" per lanciarlo a mano

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scarica il feed DealerK
        env:
          DEALERK_FEED_URL: ${{ secrets.DEALERK_FEED_URL }}
        run: |
          curl -sSf --retry 3 --max-time 300 -o feed_dealerk.xml "$DEALERK_FEED_URL"
          size=$(stat -c %s feed_dealerk.xml)
          echo "Feed scaricato: $size byte"
          test "$size" -gt 1000000 || { echo "Feed troppo piccolo, mi fermo"; exit 1; }

      - name: Pagine Pages senza Jekyll
        run: |
          mkdir -p docs
          touch docs/.nojekyll

      # --- Azzurra Store ---------------------------------------------------
      - name: "Azzurra Store: mappa N. Stock -> URL"
        run: python crawl_site.py azzurrastore

      - name: "Azzurra Store: converti nel formato Meta"
        run: python convert.py azzurrastore feed_dealerk.xml

      # --- Broker Automobili ----------------------------------------------
      # continue-on-error: se Broker fallisce, Azzurra Store viene pubblicato lo stesso
      - name: "Broker: mappa N. Stock -> URL"
        id: broker_crawl
        continue-on-error: true
        run: python crawl_site.py broker

      - name: "Broker: converti nel formato Meta"
        if: steps.broker_crawl.outcome == 'success'
        continue-on-error: true
        run: python convert.py broker feed_dealerk.xml

      - name: Pubblica
        if: always()
        run: |
          git config user.name "meta-feed-bot"
          git config user.email "meta-feed-bot@users.noreply.github.com"
          git add -A docs url_map*.json
          git diff --cached --quiet || git commit -m "Aggiornamento feed $(date -u +%F)"
          git push
